# Netlify — static PWA, no build step: publish the repo root exactly as-is.
# Deploys happen automatically on every push to the production branch (main).
[build]
  publish = "."
  command = ""

# The service worker must never be served stale: a cached sw.js would pin
# phones to an old app version. (The app also registers with
# updateViaCache:"none" — this header is the server-side half of that.)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

# The shell is network-first in the SW; keep the CDN from pinning it too.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Shared master list + fleet data: clients fetch with cache:no-store, but keep
# the CDN copy short-lived so a pushed equipment.json reaches phones quickly.
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
