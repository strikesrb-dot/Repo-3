<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Operational Success" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Operational Success</title>
<!-- No web-font CDN: sending each cold start to Google (IP/UA/timing) is a privacy leak and fails
     offline. Every font-family below carries a full system fallback stack, so the UI is unchanged. -->
<link rel="stylesheet" href="staffing.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="requests.css" />
<link rel="stylesheet" href="gse.css" />
<link rel="stylesheet" href="equipment.css" />
<link rel="stylesheet" href="inventory.css" />
<link rel="stylesheet" href="paats.css" />
<link rel="stylesheet" href="safety.css" />
<link rel="stylesheet" href="present.css" />
<link rel="stylesheet" href="settings.css" />
<style>
  /* ===== EWR MT HUB design tokens — Apple-structured, United-skinned (see CLAUDE.md) ===== */
  :root{
    /* United palette */
    --ua-blue:#0033a0; --ua-action:#1414d2; --ua-action-hi:#2222d8; --ua-action-lo:#0f0fae;
    --ua-vivid:#2f5ae5; --ua-navy:#0a1f44; --ua-navy-deep:#001840; --ua-navy-2:#14305e;
    --ua-purple:#6244bb; --ua-lavender:#cfc4f2; --ua-sky:#a6e3f5; --ua-plum:#5c1f4b;
    --ua-red:#c8102e; --ua-green:#008009; --ua-amber:#f5a623; --ua-amber-text:#b45309;
    /* neutrals (warmed Apple roles) */
    --bg:#f7f4f0; --bg-inset:#efeae3; --card:#fff;
    --ink:#0a1f44; --muted:#5c6470; --muted-weak:#8d8983;
    --line:#e2dcd3; --hairline:rgba(0,24,64,.14); --field-border:#86868b;
    /* on-dark */
    --dk-ink:#f7f4f0; --dk-muted:#96a3bd; --dk-line:rgba(247,244,240,.2);
    --dk-link:#a6e3f5; --ok-dark:#3ddc74; --bad-dark:#ff5a5c;
    /* LEGACY REPOINTS — old names keep working, new values */
    --navy:#0033a0;      /* was #0b3d63 → United Blue (legacy accent duty) */
    --navy-d:#0a1f44;    /* was #08304e → deep navy surface */
    --accent:#f5a623; --accent-d:#d98c0a;   /* demoted to status amber only */
    --melon:#fc4c4e;     /* badge/urgent fill only; text-red is --ua-red */
    --good:#008009; --good-bg:#e6f4ea; --danger:#c8102e;
    /* radius / shadow */
    --r-xs:6px; --r-sm:10px; --r-md:12px; --r-lg:18px; --r-tile:22px; --r-2xl:28px; --r-pill:980px;
    --shadow-1:2px 4px 12px rgba(0,24,64,.08);
    --shadow-2:2px 4px 16px rgba(0,24,64,.16);
    --shadow-modal:3px 5px 30px rgba(0,24,64,.22);
    --shadow:var(--shadow-1);
    /* motion */
    --ease:cubic-bezier(.4,0,.6,1); --ease-out:cubic-bezier(0,0,.5,1); --ease-enter:cubic-bezier(.28,.11,.32,1);
    --dur-tap:100ms; --dur-1:240ms; --dur-2:320ms; --dur-push:350ms; --dur-modal:400ms; --stagger:20ms;
    /* spacing / layout / chrome */
    --gap:12px; --sect-pad:48px; --pad-card:20px; --content-max:980px;
    --nav-h:48px; --ribbon-h:52px; --hit:44px; --row-h:48px; --field-h:56px; --disabled:.42;
    --nav-bg:rgba(0,0,0,.8); --nav-bg-solid:#000; --nav-blur:saturate(180%) blur(20px);
    --nav-ink:rgba(255,255,255,.8);
    --scrim:rgba(0,24,64,.45);
    --focus:#2f5ae5; --focus-dark:#a6e3f5;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:light}  /* app is a fixed light theme; keep native autofill/date pickers light too */
  html,body{margin:0;padding:0}
  body{font:400 17px/1.47059 var(--font);letter-spacing:-.022em;
    background:var(--bg);color:var(--ink);padding-bottom:24px;touch-action:manipulation;
    -webkit-font-smoothing:antialiased;}
  b,strong{font-weight:600}
  html{touch-action:manipulation}
  button,a,.chip,.selpill,.hubtile,.iconbtn,summary{touch-action:manipulation}
  #hdrTitle{cursor:pointer}
  [hidden]{display:none !important}
  .hubgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:6px 2px}
  .hubtile{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 2px 10px rgba(20,40,70,.08);padding:22px 10px;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;text-align:center;line-height:1.2}
  .hubtile:active{transform:scale(.97)}
  .hubtile .hi{font-size:34px;line-height:1}
  .hubsec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 4px 8px}
  .hubgrid.one{grid-template-columns:1fr}
  /* 4-tile home landing — flat United accents, Apple tile geometry (r22, press scale, no shadow) */
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);padding:14px 4px}
  @media (max-width:480px){.home-grid{grid-template-columns:1fr}}
  .home-tile{position:relative;background:var(--ua-navy);color:#fff;border:none;border-radius:var(--r-tile);box-shadow:none;padding:24px 24px 26px;min-height:180px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:6px;cursor:pointer;text-align:left;overflow:hidden;transition:transform var(--dur-2) var(--ease-out)}
  .home-tile:active{transform:scale(.98);transition-duration:var(--dur-tap)}
  @media (hover:hover) and (pointer:fine){.home-tile:hover{transform:scale(1.01)}}
  .home-tile[data-home="requests"]{background:var(--ua-action)}
  .home-tile[data-home="gse"]{background:var(--ua-sky);color:var(--ink)}
  .home-tile[data-home="safety"]{background:var(--ua-lavender);color:var(--ink)}
  .home-tile[data-home="paats"]{background:var(--ua-plum)}
  .home-grid.one{grid-template-columns:1fr;margin-top:14px}
  .home-tile.present{background:#000;min-height:150px}
  .home-div{display:flex;align-items:center;gap:14px;margin-top:26px;
    font:600 12px/1.3 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .home-div::before,.home-div::after{content:'';flex:1;height:1px;background:var(--hairline)}
  .home-tile .ht-ic{position:absolute;top:18px;left:20px;opacity:.9}
  .home-tile .ht-ic svg{width:32px;height:32px}
  .home-tile .ht-t{font:600 24px/1.125 var(--font);letter-spacing:0}
  .home-tile .ht-s{font:400 14px/1.4286 var(--font);letter-spacing:-.016em;opacity:.9}
  .home-tile.soon{background:var(--bg-inset);color:var(--muted);box-shadow:none}
  .home-tile.soon:active{transform:none}
  .ic{width:1em;height:1em;vertical-align:-.15em;display:inline-block;flex:none}
  .hubtile .hi .ic{width:34px;height:34px;vertical-align:0}
  /* black identity bar — Apple nav geometry, United black. Blur scrim is the only separation.
     Scoped to body>header: in-screen <header class="ui-header"> elements must NOT pick this up. */
  body>header{position:sticky;top:0;z-index:100;color:#fff;
    padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;
    background:var(--nav-bg-solid);-webkit-user-select:none;user-select:none}
  @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    body>header{background:var(--nav-bg);-webkit-backdrop-filter:var(--nav-blur);backdrop-filter:var(--nav-blur)}}
  .hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer}
  .brand .logo{width:30px;height:30px;border-radius:7px;background:var(--ua-action);color:#fff;display:flex;align-items:center;justify-content:center}
  .brand .logo .ic{width:18px;height:18px;vertical-align:0}
  .brand-txt{display:flex;flex-direction:column;gap:3px}
  .brand .eyebrow{font:400 9.5px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--nav-ink)}
  .brand .wordmark{font:600 17px/1.235 var(--font);letter-spacing:-.022em;line-height:1;white-space:nowrap;color:#fff}
  .homebtn{width:38px;height:38px;border:none;border-radius:50%;background:transparent;color:var(--nav-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:color var(--dur-2) var(--ease)}
  .homebtn:active{color:#fff;transform:scale(.94);transition:none}
  @media (hover:hover){.homebtn:hover{color:#fff}}
  .homebtn .ic{width:20px;height:20px;vertical-align:0}
  body>header .sub{margin:6px 2px 0;font:400 12px/1.3333 var(--font);letter-spacing:-.01em;color:var(--nav-ink)}
  main{max-width:760px;margin:0 auto;padding:14px}
  /* 13" iPad (portrait ~1032 / landscape ~1366) gets more room */
  @media (min-width:820px){ main{max-width:980px;padding:18px} }
  @media (min-width:1200px){ main{max-width:1180px;padding:22px} }
  /* the assign/staffing board packs tug + area cards, so let it use the full width
     on big screens instead of leaving dead gutters (other tabs stay comfortably narrow) */
  @media (min-width:1100px){ body[data-tab="staffing"] main{max-width:none;padding-left:20px;padding-right:20px} }
  .view{display:none}.view.active{display:block}
  h2.section{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 4px 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .catblock{overflow:hidden;border-radius:16px}
  .catblock .cathdr{border-radius:16px 16px 0 0}
  .card.pad{padding:14px}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(11,61,99,.12)}
  textarea{min-height:64px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:var(--r-sm);font-size:17px;font-weight:400;letter-spacing:-.022em}
  /* CTA family — Apple pill geometry, United action blue. Full-width buttons de-pill to r-md. */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--hit);
    padding:11px 21px;width:100%;border-radius:var(--r-md);border:1px solid transparent;
    background:var(--ua-action);color:#fff;font:400 17px/1.176 var(--font);letter-spacing:-.022em;
    white-space:nowrap;transition:background-color var(--dur-tap) linear}
  .btn:active{background:var(--ua-action-lo);transition:none}
  @media (hover:hover){.btn:hover{background:var(--ua-action-hi)}}
  .btn.navy{background:var(--ua-navy);color:#fff}.btn.navy:active{background:var(--ua-navy-2)}
  .btn.ghost{background:transparent;color:var(--ua-blue);border-color:var(--ua-blue)}
  .btn.ghost:active{background:var(--ua-blue);color:#fff}
  @media (hover:hover){.btn.ghost:hover{background:var(--ua-blue);color:#fff}}
  .btn.green{background:var(--ua-green);color:#fff}.btn.green:active{filter:brightness(.92)}
  .more-ic{width:54px;height:54px;margin:6px auto 0;border-radius:50%;background:var(--good-bg);color:var(--good);font-size:28px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .btn.sm{width:auto;padding:8px 15px;font-size:14px;line-height:1.2857;letter-spacing:-.016em;min-height:36px;border-radius:var(--r-pill);position:relative}
  .btn.sm::after{content:'';position:absolute;inset:-4px 0}
  .btn.danger{background:#fff;color:var(--ua-red);border:1px solid rgba(200,16,46,.35)}
  .btn.danger:active{background:var(--ua-red);color:#fff}
  .btn[disabled]{opacity:var(--disabled);pointer-events:none}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
  .btnrow{display:flex;gap:10px;margin-top:12px}
  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .toolbar input,.toolbar select{flex:1;min-width:120px}
  .count{font-size:13px;color:var(--muted);margin:0 4px 8px}
  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
  .item{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:18px;box-shadow:0 2px 8px rgba(20,40,70,.07)}
  .item:active{transform:scale(.992)}
  .item .main{flex:1;min-width:0}
  .item .tag{font-weight:700;font-size:16px;letter-spacing:.2px}
  .item .meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .meta .volt{font-size:11px;font-weight:700;color:var(--good);background:var(--good-bg);border-radius:5px;padding:1px 6px;margin-left:7px}
  .item .meta .subt{font-size:11px;font-weight:700;color:var(--navy);background:#eaf1f7;border-radius:5px;padding:1px 6px;margin-left:7px}
  .item .notes{font-size:13px;color:var(--muted);margin-top:2px}
  .loc{display:inline-block;background:#eaf1f7;color:var(--navy);font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .loc.none{background:#f7eaea;color:var(--danger)}
  .item .acts{display:flex;gap:6px}
  /* grouped/hubbed list: stacked groups, each a responsive grid of cards */
  .eqgrid{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
  @media(min-width:680px){.eqgrid{display:grid;grid-template-columns:repeat(2,1fr)}}
  @media(min-width:1000px){.eqgrid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:1300px){.eqgrid{grid-template-columns:repeat(4,1fr)}}
  .eqgrid .item{align-items:flex-start}
  .eqgroup .eqg-h{display:flex;align-items:center;gap:9px;width:100%;background:#eef3f7;border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;margin-bottom:11px}
  body.demo-on::after{content:"DEMO";position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9000;background:#7a3287;color:#fff;font-weight:900;font-size:11px;letter-spacing:.12em;padding:4px 12px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.25);pointer-events:none;opacity:.85}
  .eqg-name{font-weight:800;color:var(--navy);font-size:15px;text-transform:uppercase;letter-spacing:.3px}
  .eqg-n{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);background:#fff;border-radius:999px;padding:2px 10px}
  .eqg-ca{color:var(--navy);font-weight:800;width:14px;text-align:center}
  .eqgroup.collapsed .eqgrid{display:none}
  .eqgroup.collapsed .eqg-h{margin-bottom:0}
  .iconbtn{background:#f1f4f7;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:15px;color:var(--ink)}
  .iconbtn:active{background:#e4e9ee}
  .empty{text-align:center;color:var(--muted);padding:40px 16px}.empty .big{font-size:40px}
  .crows{list-style:none;margin:0;padding:0}
  .crow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .crow:active{background:#f0f4f7}.crow.on{background:#eaf4ec}
  .crow .box{width:22px;height:22px;border:2px solid #b8c2cc;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
  .crow.on .box{background:var(--good);border-color:var(--good)}
  .crow .ctag{font-weight:700;font-size:15px}
  .crow .ctype{font-size:12px;color:var(--muted)}
  .crow .cloc{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
  /* inventory pill — design 3 "corner badge": tap-cycle card with a corner status dot */
  .pillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:13px;padding:12px 2px 4px}
  .selpill{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 8px;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;text-align:center}
  .selpill:active{transform:scale(.96)}
  .selpill .selc{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;border:none;display:none;align-items:center;justify-content:center;font-size:12px;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .selpill.on{background:var(--good-bg);border-color:var(--good);color:#15622f}
  .selpill.on .selc{display:inline-flex;background:var(--good)}
  .selpill.oos{background:#fdecec;border-color:#d9342b;color:#b3251d}
  .selpill.oos .selc{display:inline-flex;background:#d9342b}
  .selpill .oostag{display:none}
  .selpill.away{border-style:dashed}
  .selpill.locked{opacity:.5;cursor:not-allowed;border-style:dashed;background:#f6f7f9}
  .selpill.locked .pillspot{background:transparent;color:var(--muted)}
  /* floating tap menu when picking equipment in inventory */
  .invpop-back{position:fixed;inset:0;z-index:300;background:rgba(12,24,40,.45);display:flex;align-items:center;justify-content:center;padding:24px;animation:invFade var(--dur-1) var(--ease)}
  .invpop{z-index:301;width:100%;max-width:330px;background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(10,25,45,.35);padding:14px;display:flex;flex-direction:column;gap:9px;animation:invPop var(--dur-1) var(--ease-out)}
  @keyframes invFade{from{opacity:0}to{opacity:1}}
  @keyframes invPop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
  .invpop .pophead{font-size:17px;font-weight:800;color:var(--ink);text-align:center;padding:2px 4px 4px}
  .invpop button{border:none;border-radius:12px;padding:15px 14px;font-size:16px;font-weight:800;text-align:center;cursor:pointer;color:var(--ink);background:#f1f4f7}
  .invpop button.confirmbtn{background:var(--good);color:#fff}
  .invpop button.oosbtn{background:#d9342b;color:#fff}
  .invpop button.rmbtn{background:#f1f4f7;color:#5a6772}
  .invpop .zonebtn{border:none;border-radius:12px;padding:15px 14px;font-size:16px;font-weight:800;text-align:center;cursor:pointer;color:var(--ink);background:#eef2f5}
  .invpop .zonebtn:active{transform:scale(.98)}
  .invpop .spotwrap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:46vh;overflow:auto;padding:2px}
  .invpop .spotbtn{border:1.5px solid var(--line);border-radius:10px;padding:12px 3px;font-size:14px;font-weight:800;text-align:center;cursor:pointer;color:var(--ink);background:#fff}
  .invpop .spotbtn:active{transform:scale(.95)}
  .invpop .spotbtn.ac{border-color:#cfe0f0;background:#f5f9fd}
  .invpop .spotbtn.sel{border-color:var(--good);background:var(--good-bg);color:#15622f}
  .invpop .spotscroll{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
  .invpop .spotscroll .spotwrap{max-height:none;overflow:visible}
  .invpop .popgrp{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin:6px 2px 0;text-align:left}
  .invpop #invNoseInput{margin:2px 0}
  .invpop .nosesug{display:flex;flex-direction:column;gap:4px;max-height:34vh;overflow:auto}
  .invpop .nosehit{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;font-size:14px;font-weight:700;text-align:left;cursor:pointer;color:var(--ink)}
  .invpop .nosehit span{font-weight:600;color:var(--muted);font-size:12px}
  .selpill .pillspot{font-size:10px;font-weight:700;color:var(--muted);background:#eef2f5;border-radius:6px;padding:2px 5px;margin-left:1px}
  .selpill.on .pillspot{color:#15622f;background:rgba(30,125,70,.14)}
  .selpill .pill-spotbtn{font-size:10px;font-weight:800;color:#15622f;background:#fff;border:1px dashed var(--good);border-radius:7px;padding:2px 7px;margin-top:1px;cursor:pointer}
  .selpill .pill-spotbtn:active{transform:scale(.94)}
  .selpill.oos .pillspot{color:#b3251d;background:rgba(217,52,43,.12)}
  /* in-app image preview (keeps you on the sheet, no navigation away) */
  .imgprev-back{position:fixed;inset:0;z-index:400;background:rgba(12,24,40,.6);display:flex;align-items:center;justify-content:center;padding:16px;animation:invFade var(--dur-1) var(--ease)}
  .imgprev{width:100%;max-width:520px;max-height:92vh;background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(10,25,45,.4);display:flex;flex-direction:column;overflow:hidden}
  .imgprev-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:15px;font-weight:800;border-bottom:1px solid var(--line)}

(function(){
  const PAT="25876",lock=$("#siteLock"),pad=$("#sitePad");if(!lock||!pad)return;
  // remember an unlock for the shift so a reload (incl. a service-worker update) doesn't re-lock
  const ULK="elt.lock.ok",ULWIN=12*3600*1000;
  const unlocked=()=>{try{const t=+(localStorage.getItem(ULK)||0);return t&&(Date.now()-t)<ULWIN;}catch(_){return false;}};
  const markUnlocked=()=>{try{localStorage.setItem(ULK,String(Date.now()));}catch(_){}};
  if(unlocked()){lock.remove();return;}
  let sel=[],drawing=false;
  function build(){sel=[];drawing=false;pad.classList.remove("err");
    pad.innerHTML=`<svg viewBox="0 0 280 280" preserveAspectRatio="none"><polyline id="siteLine" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points=""></polyline></svg>`+

  function pt(e){const rc=pad.getBoundingClientRect();return {x:(e.clientX-rc.left)*280/rc.width,y:(e.clientY-rc.top)*280/rc.height};}
  function hit(p){for(let i=0;i<9;i++){if(sel.includes(i))continue;const d=dotPos(i);if(Math.hypot(d.x-p.x,d.y-p.y)<32){sel.push(i);const dot=pad.querySelector(`.patdot[data-i="${i}"]`);if(dot)dot.classList.add("on");}}}
  function line(cur){const pts=sel.map(i=>{const p=dotPos(i);return p.x+","+p.y;});if(cur)pts.push(cur.x+","+cur.y);const l=$("#siteLine");if(l)l.setAttribute("points",pts.join(" "));}

// show the generated PNG inside the app so we never navigate away from the sheet
function showImagePreview(blob,filename){
  const url=URL.createObjectURL(blob);
  const fn=String(filename||"");
  const mime=/\.jpe?g$/i.test(fn)?'image/jpeg':'image/png';
  const back=document.createElement('div');back.className='imgprev-back';
  const canShare=navigator.canShare&&navigator.canShare({files:[new File([blob],filename,{type:mime})]});
  const title=/Staffing/i.test(fn)?"Staffing sheet":/Briefing/i.test(fn)?"Daily Briefing":/equipment/i.test(fn)?"Equipment list":"Image";
  back.innerHTML=`<div class="imgprev">
    <div class="imgprev-bar"><span>${esc(title)}</span><button class="imgprev-x" aria-label="Close">✕</button></div>
    <div class="imgprev-scroll"><img id="imgprevImg" src="${url}" alt="${esc(title)}" draggable="true" /></div>
    <p class="imgprev-hint">Drag the image out to a chat, email, or your desktop — or save it.</p>
    <div class="imgprev-acts">
      ${canShare?`<button class="btn navy" data-a="share">Share / Save</button>`:`<a class="btn navy" href="${url}" download="${esc(filename)}">Save image</a>`}
      <button class="btn ghost" data-a="done">Done</button>
    </div></div>`;
  document.body.appendChild(back);
  const close=()=>{back.remove();URL.revokeObjectURL(url);};

  back.querySelector('[data-a="done"]').onclick=close;
  back.addEventListener('click',e=>{if(e.target===back)close();});
  // let the user drag the image straight out to the filesystem / another app (with a real filename)
  back.querySelector('#imgprevImg').addEventListener('dragstart',e=>{
    try{e.dataTransfer.setData('DownloadURL',mime+':'+filename+':'+url);e.dataTransfer.effectAllowed='copy';}catch(_){}});
  back.querySelector('[data-a="share"]')?.addEventListener('click',async()=>{
    try{await navigator.share({files:[new File([blob],filename,{type:mime})],title:title});}
    catch(_){}});
}

function wrapText(ctx,text,maxW){const words=String(text).split(/\s+/),lines=[];let cur="";
  for(const w of words){const t=cur?cur+" "+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines.length?lines:[""];}
function pngFromItems(filename,items){
  const W=1000,pad=40,c=document.createElement("canvas"),mx=c.getContext("2d");
  const draws=[];let y=pad;
  for(const it of items){
    if(it.gap){y+=it.gap;continue;}
    if(it.sep){draws.push({sep:true,y:y+6});y+=18;continue;}
    mx.font=`${it.b?"bold ":""}${it.size}px -apple-system,Arial,sans-serif`;
    for(const w of wrapText(mx,it.t,W-pad*2-(it.indent||0))){y+=it.size+6;draws.push({t:w,x:pad+(it.indent||0),y,font:mx.font,color:it.color||"#111"});}
    y+=4;}
  c.width=W;c.height=y+pad;
  const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
  for(const d of draws){if(d.sep){ctx.strokeStyle="#e0e0e0";ctx.beginPath();ctx.moveTo(pad,d.y);ctx.lineTo(W-pad,d.y);ctx.stroke();}
    else{ctx.fillStyle=d.color;ctx.font=d.font;ctx.fillText(d.t,d.x,d.y);}}
  c.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);toast("Image downloaded");},"image/png");}

    return {title:"Equipment — "+scope.value+" · "+scope.sub,mode:"area",groups:[{label:scope.value+" · "+scope.sub,items}]};

  if(scope.kind==="type"){
    const items=data.equipment.filter(e=>(e.type||"")===scope.value);
    const areas=[...new Set(items.map(e=>e.location||"No location"))].sort(natSort);
    return {title:"Equipment — "+scope.value,mode:"type",groups:areas.map(a=>({label:a,items:items.filter(e=>(e.location||"No location")===a)}))};

  const areas=scope.kind==="all"?[...new Set(data.equipment.map(e=>e.location||"No location"))].sort(natSort):[scope.value];
  return {title:scope.kind==="all"?"Equipment — All Areas":"Equipment — "+scope.value,mode:"area",

  const sp=e=>{const d=invDetail(e.spot,e.nose);return d?"  ["+d+"]":"";};
  groups.forEach(g=>{L.push(g.label.toUpperCase()+" ("+g.items.length+")");
    if(mode==="type"){sortTags(g.items).forEach(e=>L.push("    [ ] "+e.tag+sp(e)+(e.subtype?"  – "+e.subtype:"")+(e.volt?"  ("+e.volt+")":"")+(e.oos?"  ** OOS **":"")));}
    else{groupByType(g.items).forEach(c=>{L.push("  "+c.type+":");sortTags(c.items).forEach(e=>L.push("    [ ] "+e.tag+sp(e)+(e.subtype?"  – "+e.subtype:"")+(e.volt?"  ("+e.volt+")":"")+(e.oos?"  ** OOS **":"")));});}
    L.push("");});
  const blob=new Blob([L.join("\n")],{type:"text/plain"}),u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download="equipment-"+todayISO()+".txt";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);toast("Text file downloaded");}



/* ---- output/backup ---- */
// the master list is equipment/type/location data ONLY — never settings (passcode!),
// secure-log incidents, movements, or EOS reports. Those must not travel in a public file.
const MASTER_FIELDS=["equipment","types","locations","equipLocs","locZones","spotAircraft","subtypes","locSeedV","typeSeedV","locNormV","typeMergeV","bpMerged"];
function masterSubset(src){const o={};MASTER_FIELDS.forEach(k=>{if(src[k]!==undefined)o[k]=src[k];});return o;}
function downloadJSON(name,msg,obj){const b=new Blob([JSON.stringify(obj||data,null,2)],{type:"application/json"});
  const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);toast(msg);}

/* ---- master list ---- */
async function fetchMaster(){try{const r=await fetch(MASTER_URL+"?t="+todayISO(),{cache:"no-store"});
  if(!r.ok)return null;const d=await r.json();return d&&Array.isArray(d.equipment)?d:null;}catch(e){return null;}}
// merge only master fields — never let a fetched file overwrite local settings/passcode,
// secure log, movements, or EOS data (an old master could carry them; a hostile one could too)
function applyMaster(m){const cur=Store.getJSON(KEY,null)||data||{};Object.assign(cur,masterSubset(m));Store.setJSON(KEY,cur);data=load();save();}
async function autoLoadMaster(){if(data.equipment.length||Store.getRaw(SEEN_KEY,null))return;
  const m=await fetchMaster();Store.setRaw(SEEN_KEY,"1");
  if(m&&m.equipment.length){applyMaster(m);refreshAll();toast(`Loaded ${m.equipment.length} items from master list`);}}

/* ---- refresh ---- */
function refreshAll(){updateHdr();renderGse();}
// ---- cross-window live refresh (equipment / GSE side) — mirrors the staffing.js listener ---------
// Two windows on one machine share localStorage, so a write in window A (marking a unit out of
// service, a GSE acknowledge/reply, a photo) fires a 'storage' event here in window B. We reload
// `data` and re-render so the change appears live — this powers the OOS -> GSE demo with no network.
// NOT gated on sync/demo: persist() writes elt.data.v1 even offline, so the mirror works fully local
// and masked. Guards below stop a peer write from disrupting an in-progress count or a reply mid-type.
(function(){
  let t=null;
  const busyReplying=()=>{const ae=document.activeElement;
    return !!(ae&&ae.closest&&(ae.closest(".gse-thread")||(ae.closest("#gseRoot")&&/^(INPUT|TEXTAREA)$/.test(ae.tagName))));};
  window.addEventListener("storage",e=>{
    if(!e.key)return;
    if(e.key!==KEY && e.key.indexOf("elt.oos.photo.")!==0)return;
    if(window.INV&&INV.inProgress&&INV.inProgress())return;   // don't wipe an uncommitted count
    if(busyReplying())return;                                        // don't blow away a reply being typed
    clearTimeout(t); t=setTimeout(()=>{
      if(busyReplying())return;
      data=load();
      renderGse();updateHdr();
    },200);
  });
})();
function updateHdr(){applyBrandLabels();const cust=data.settings&&data.settings.headerSub;
  if(cust){$("#hdrSub").textContent=cust;return;}
  const n=data.equipment.length,locs=new Set(data.equipment.map(e=>e.location).filter(Boolean)).size;
  $("#hdrSub").textContent=n?`${n} unit${n===1?"":"s"} across ${locs} location${locs===1?"":"s"}`:"Ground support equipment · staging & audits";}
// apply the user's custom app-name / eyebrow to the header (blank eyebrow hides it)
function applyBrandLabels(){ const L=(data.settings&&data.settings.labels)||{};
  const eb=document.querySelector('.brand .eyebrow');
  if(eb){const t=('eyebrow' in L)?String(L.eyebrow||'').trim():'United Ground Ops';eb.textContent=t;eb.style.display=t?'':'none';}
  const wordmark=(L.wordmark&&String(L.wordmark).trim())||'Operational Success';
  const wm=document.querySelector('.brand .wordmark'); if(wm)wm.textContent=wordmark;
  const sl=document.querySelector('.sl-title'); if(sl)sl.textContent=wordmark;   // lock-screen splash
  const ib=document.querySelector('.inv-banner .ib-brand'); if(ib)ib.textContent=wordmark;
  try{document.title=wordmark+' — '+((L.eyebrow!=null?String(L.eyebrow):'Ground Ops')||'Ground Ops');}catch(_){} }

/* ---- init ---- */
(async function(){save();document.body.classList.toggle("demo-on",demoOn());if(!loadFleetCache())await fetchFleet();refreshAll();applyTileVisibility();
  await autoLoadMaster();
  // boot settled: baseline the config signature so only genuine edits from here bump the sync timestamp
  _cfgSig=configSig(); cfgReady=true;
  // initial team pull once staffing.js has exposed window.SYNC
  setTimeout(()=>{ if(window.SYNC&&window.SYNC.on())syncSite(true); },1500);})();
if("serviceWorker" in navigator){
  let reloading=false,waitingWorker=null,iInitiatedUpdate=false;
  const hadController=!!navigator.serviceWorker.controller;   // false on first install → never reload then
  // reload ONLY in the tab that actually tapped "Update". The SW's clients.claim() fires
  // controllerchange in EVERY open tab; without the initiator flag, a colleague's other tab
  // (mid-board) would reload and lose its in-progress state through no action of their own.
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloading||!hadController||!iInitiatedUpdate)return; reloading=true; location.reload(); });
  function applyUpdate(){ iInitiatedUpdate=true; if(waitingWorker)waitingWorker.postMessage("skipWaiting"); }
  function showUpdateToast(w){ waitingWorker=w; if(document.getElementById("swUpdate"))return;
    const el=document.createElement("div");el.id="swUpdate";
    el.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));z-index:9998;background:var(--ua-navy);color:#fff;padding:10px 8px 10px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.28);font-weight:700;font-size:14px;display:flex;align-items:center;gap:12px";
    const b=document.createElement("button");b.textContent="Update";b.style.cssText="background:#f5a623;color:#10171f;border:none;border-radius:999px;padding:7px 16px;font-weight:800;font:inherit;cursor:pointer";
    b.onclick=applyUpdate; el.append("New version ready",b); document.body.appendChild(el); }
  // only prompt when replacing an existing controller (not on the very first install)
  const canPrompt=()=>!!navigator.serviceWorker.controller;
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
      reg.update().catch(()=>{});
      if(reg.waiting&&canPrompt())showUpdateToast(reg.waiting);
      reg.addEventListener("updatefound",()=>{const w=reg.installing;if(!w)return;
        w.addEventListener("statechange",()=>{ if(w.state==="installed"&&canPrompt())showUpdateToast(w); });});
      setInterval(()=>reg.update().catch(()=>{}),60000);
      document.addEventListener("visibilitychange",()=>{ if(!document.hidden)reg.update().catch(()=>{}); });
    }).catch(()=>{});
  });
}
